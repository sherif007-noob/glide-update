name: Update Glide Closing Prices

on:
  schedule:
    # Runs at :02, :17, :32, :47 past the hour between 10:00 AM and 2:47 PM Cairo time (07:02 - 11:47 UTC), Sun-Thu
    - cron: '2,17,32,47 7-11 * * 0-4'
    
    # Post-close sync at 3:05 PM Cairo time (12:05 UTC), Sun-Thu
    - cron: '5 12 * * 0-4'

    # Final end-of-day reconciliation at 4:05 PM Cairo time (13:05 UTC), Sun-Thu
    - cron: '5 13 * * 0-4'

  workflow_dispatch: # Allows manual run at any time

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync_prices.py
