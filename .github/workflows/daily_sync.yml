name: Update Glide Closing Prices

on:
  schedule:
    # Every 15 minutes between 10:00 AM and 2:45 PM Cairo time (07:00 - 11:45 UTC), Sun-Thu
    - cron: '*/15 7-11 * * 0-4'
    
    # Market close sync at 3:00 PM Cairo time (12:00 UTC), Sun-Thu
    - cron: '0 12 * * 0-4'

    # End-of-day final sync at 4:00 PM Cairo time (13:00 UTC), Sun-Thu
    - cron: '0 13 * * 0-4'

  workflow_dispatch: # Allows manual trigger anytime

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python sync_prices.py
